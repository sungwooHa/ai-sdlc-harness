{
  "version": 2,
  "format": "json-compatible-yaml",
  "description": "Machine-readable contract for the __PROJECT_NAME__ agent development harness (AI-native SDLC layout).",
  "layers": {
    "always_on": [
      "AGENTS.md",
      "CLAUDE.md"
    ],
    "per_app": [
      "apps/__APP__/AGENTS.md"
    ],
    "on_demand": ".agents/skills",
    "deterministic": [
      ".claude/settings.json",
      ".codex/hooks.json",
      ".husky/pre-commit"
    ],
    "artifacts": "docs/changes (local-only working folder; history lives on the PR)",
    "evals": ".claude/evals",
    "subagents": ".claude/agents"
  },
  "always_on_max_lines": 120,
  "per_app_max_lines": 80,
  "evals": {
    "description": "Behavioural regression cases for the harness itself, run through `claude -p` (uses model quota; not part of test:harness). Run after changing AGENTS.md, apps/*/AGENTS.md, .agents/**, .claude/**, or scripts/*guard*.",
    "cases": ".claude/evals/cases.jsonl",
    "runner": "scripts/harness/run-evals.py",
    "readme": ".claude/evals/README.md",
    "run_command": "__PACKAGE_MANAGER__ evals:harness"
  },
  "artifact_chain": {
    "root": "docs/changes",
    "folder_pattern": "<YYMMDD_NN>-<slug>",
    "templates_dir": "docs/changes/_templates",
    "documents": [
      "intent.md",
      "spec.md",
      "plan.md"
    ],
    "review_gate": "Intent/spec confirmation and pre-implementation agreement are human decisions. Before product implementation, present the applicable HTML drafts and the plan, obtain approval of that revision, and preserve the baseline under agreements/<revision>/. Code review verifies implementation; the PR reviews realized value against that agreement.",
    "ui_review_waiver": "/__PREFIX__-ui-review is required for a diff under __UI_SOURCE_GLOB__ unless the approved plan.md states 시각 변경 없음 (no visual change); the implement adapter records the waiver in its final report.",
    "deliverables": {
      "dir": "deliverables",
      "files": [
        "mockup.html",
        "flow.html",
        "architecture.html",
        "설명서(eli7).html"
      ],
      "rule": "Keep all four HTML perspectives under the existing required_when conditions. Draft them in spec/plan before product implementation; present one explainer entrypoint linking the other required views. Preserve approved files in agreements/<revision>/deliverables/. After implementation update only the working deliverables/ with actual evidence and deviations; attach both the agreed baseline and the result for PR value review. See AGREEMENT_REVIEW.md.",
      "ui_glob": "__UI_SOURCE_GLOB__",
      "required_when": {
        "설명서(eli7).html": "plan-scale change (two or more apps/* or any packages/*) or ui path (__UI_SOURCE_GLOB__) — the reviewer's low-load explainer",
        "mockup.html": "ui path",
        "flow.html": "ui path",
        "architecture.html": "ui path"
      }
    },
    "history_policy": "The change folder is a local working area, gitignored except README.md and _templates/. Nothing under docs/changes/<YYMMDD_NN>-<slug>/ is committed; the PR description (from _templates/pr.md) and PR attachments carry the history. The repo keeps rules only.",
    "plan_gate": {
      "base": "origin/__INTEGRATION_BRANCH__",
      "evidence": "commit trailer `Plan-Ref: <YYMMDD_NN>-<slug>` on at least one commit in the PR range",
      "rule": "A PR that touches more than one app or any packages/* contract must carry a Plan-Ref trailer; the PR compares value and refers to the attached agreement for the full plan. CI check: scripts/harness/check-plan-artifact.sh (warn, PLAN_GATE=enforce to block)."
    },
    "pr_body": {
      "template": "docs/changes/_templates/pr.md",
      "shape": "one-sentence value title → Plan-Ref and Agreement-Ref when applicable → 그림 (agreement vs actual result) → 세 상자 (agreed expectation | observed change | evidence) → 가치 확인 (status, remaining uncertainty, follow-up) → 볼 곳 (≤3 files) → 증거 (one nonempty fence, ≤10 lines); ≤30 nonempty prose lines",
      "max_lines": 30,
      "max_evidence_lines": 10,
      "max_title_chars": 60,
      "max_box_rows": 3,
      "max_look_items": 3,
      "required_headings": [
        "## 그림",
        "## 세 상자",
        "## 가치 확인",
        "## 볼 곳",
        "## 증거"
      ],
      "rule": "PR shape/value evidence remains checked by pr-body-gate. The agreement gate additionally requires the active PR, matching approval, current source-bound verification, and approved baseline/results at Stop and pre-commit. Actual semantic value and attachment remain human judgments.",
      "value_statuses": [
        "확인됨",
        "부분 확인",
        "미검증",
        "미달"
      ]
    },
    "agreement": {
      "reference": "docs/standards/AGREEMENT_REVIEW.md",
      "dir": "agreements",
      "snapshot_command": "python3 scripts/agreement-gate.py prepare <change-folder-id> --revision 001",
      "rule": "Prepare records exact scope, draft hashes and a challenge. The user approves that challenge through /__PREFIX__-agreement approve <challenge>; the hook creates the immutable-by-convention snapshot and grants scoped implementation. Self-written approval prose and invoking the Skill tool do not grant permission."
    }
  },
  "question_gate": {
    "description": "Questions to the user in the Intent / Spec / Plan stages go through AskUserQuestion only: capped per round, header limited to the stage's categories, recommended option first plus at least two real alternatives (min_options 3). Enforced by scripts/question-gate.py (hook intent question_gate), not by prose.",
    "max_per_round": 4,
    "min_options": 3,
    "recommended_suffix": [
      "(추천)",
      "(Recommended)"
    ],
    "exit_triggers": [
      "/__PREFIX__-implement",
      "ExitPlanMode"
    ],
    "stages": {
      "intent": {
        "triggers": [
          "/__PREFIX__-intent"
        ],
        "headers": [
          "문제",
          "결과",
          "가치",
          "제약",
          "비범위",
          "이름"
        ],
        "defer": "intent.md 열린 질문(권장 답 포함) → /__PREFIX__-spec"
      },
      "spec": {
        "triggers": [
          "/__PREFIX__-spec"
        ],
        "headers": [
          "해법",
          "스토리",
          "구현",
          "테스트",
          "우려",
          "비범위"
        ],
        "defer": "spec.md Flagged Concerns → plan"
      },
      "plan": {
        "triggers": [
          "EnterPlanMode"
        ],
        "headers": [
          "변경 순서",
          "테스트",
          "리스크",
          "완료 증거"
        ],
        "defer": "plan.md 리스크와 완화"
      }
    }
  },
  "documentation_layout": {
    "active_roots": [
      "docs/standards",
      "docs/changes",
      "docs/agents",
      "docs/decisions"
    ],
    "local_only_roots": {
      "description": "Execution history that must never be committed: the harness keeps rules, the PR keeps history. Globs are matched against staged/changed paths by scripts/agent-harness-fast-guard.py (pre-commit and CI) and refused.",
      "globs": [
        "docs/changes/*/**"
      ],
      "allow": [
        "docs/changes/README.md",
        "docs/changes/_templates/**"
      ]
    },
    "retired_roots": [],
    "standards_root_files": [
      "AGENT_HARNESS.md",
      "HARNESS_PRINCIPLES.md",
      "eli7-harness.html",
      "AGREEMENT_REVIEW.md"
    ],
    "tracker_config": "docs/agents/issue-tracker.md"
  },
  "local_artifacts": {
    "description": "Local agent runtime state is not part of the harness surface and must not be scanned as repository policy.",
    "scan_excluded_paths": [
      ".claude/skills/.omc/**",
      ".codex/worktrees/**",
      ".claude/worktrees/**",
      ".serena/**"
    ],
    "claude_skill_symlink_exemptions": [
      ".claude/skills/.omc"
    ]
  },
  "skills": {
    "root": ".agents/skills",
    "claude_mirror": ".claude/skills",
    "mirror_mode": "symlink",
    "vendored": [
      {
        "source": "github.com/mattpocock/skills",
        "license": "MIT",
        "skills": [
          "grilling",
          "grill-me",
          "grill-with-docs",
          "domain-modeling",
          "to-spec",
          "to-tickets",
          "implement",
          "tdd",
          {
            "name": "code-review",
            "as": "review-since",
            "reason": "Upstream name collides with the Claude Code built-in /code-review; this one is the two-axis (standards + spec) review the artifact chain uses."
          },
          "diagnosing-bugs",
          "prototype",
          "writing-for-agents",
          "handoff"
        ],
        "update_command": "python3 scripts/harness/vendor-skills.py --source mattpocock/skills"
      },
      {
        "source": "github.com/vercel-labs/agent-skills",
        "license": "MIT",
        "skills": [
          "web-design-guidelines"
        ],
        "reason": "Web Interface Guidelines code review (accessibility, focus, forms, animation, typography, dark mode); fetches the rule set from vercel-labs/web-interface-guidelines at run time. Reached through __PREFIX__-ui-review.",
        "update_command": "python3 scripts/harness/vendor-skills.py --source vercel-labs/agent-skills"
      },
      {
        "source": "github.com/emilkowalski/skills",
        "license": "MIT",
        "skills": [
          "review-animations",
          "animation-vocabulary"
        ],
        "reason": "Interaction/motion audit for UI work. Reached through __PREFIX__-ui-review.",
        "update_command": "python3 scripts/harness/vendor-skills.py --source emilkowalski/skills"
      }
    ],
    "adapters": {
      "description": "Project skills that wrap a vendored skill with this repo's change-folder convention, paths, and language. Adapter-mapped vendored skills carry `user-invocable: false` (hidden from the slash menu, callable by the adapter through the Skill tool); vendor-skills.py rewrites an upstream `disable-model-invocation: true` on import and check-agent-harness.py fails when one survives. Users and AGENTS.md route through the adapter.",
      "map": {
        "__PREFIX__-intent": "grilling",
        "__PREFIX__-spec": "to-spec",
        "__PREFIX__-tickets": "to-tickets",
        "__PREFIX__-implement": "implement",
        "__PREFIX__-ui-review": "web-design-guidelines"
      }
    },
    "disabled": []
  },
  "host_adapters": {
    "policy": {
      "shared_policy_entrypoint": "AGENTS.md",
      "claude_entrypoint": "CLAUDE.md",
      "claude_entrypoint_must_import": "@AGENTS.md",
      "per_app_claude_mirror": "symlink CLAUDE.md -> AGENTS.md"
    },
    "claude": {
      "required_files": [
        "CLAUDE.md",
        ".claude/settings.json"
      ],
      "absolute_path_scan_files": [
        ".claude/settings.json"
      ]
    },
    "codex": {
      "required_files": [
        ".codex/config.toml",
        ".codex/hooks.json",
        ".codex/rules/commit-convention.mdc"
      ],
      "absolute_path_scan_files": [
        ".codex/config.toml",
        ".codex/hooks.json"
      ]
    }
  },
  "protected_paths": [
    {
      "id": "lockfiles",
      "globs": [
        "pnpm-lock.yaml"
      ],
      "reason": "Lockfiles are produced by the package manager.",
      "instead": "Run __PACKAGE_MANAGER__ install."
    }
  ],
  "protected_paths_examples": [
    {
      "id": "generated-sources",
      "globs": [
        "packages/**/*.generated.ts"
      ],
      "reason": "Example: generated from a source of truth; hand edits are overwritten.",
      "instead": "Edit the source and run the generator. Move this entry into protected_paths to activate it."
    }
  ],
  "shared_hook_intents": [
    {
      "id": "harness_fast_guard_stop",
      "event": "Stop",
      "description": "Fast harness guard on each agent host: docs outside active roots and user-specific absolute paths. Warns when husky is not wired.",
      "required_scripts": [
        "scripts/agent-harness-fast-guard.py"
      ],
      "host_files": {
        "claude": ".claude/settings.json",
        "codex": ".codex/hooks.json"
      }
    },
    {
      "id": "husky_shim_sessionstart",
      "event": "SessionStart",
      "description": "Write minimal .husky/_ shims when install has not run in this checkout (fresh clone, linked worktree), so pre-commit gates are live before the first commit. An absolute core.hooksPath that resolves to this repo's .husky/_ is normalized back to the relative form husky writes, so every worktree runs its own hook files.",
      "required_scripts": [
        "scripts/harness/ensure-husky.sh"
      ],
      "host_files": {
        "claude": ".claude/settings.json"
      }
    },
    {
      "id": "protected_paths_pretooluse",
      "event": "PreToolUse",
      "description": "Block agent edits to files declared in protected_paths — Edit/Write/MultiEdit by file_path, and Bash commands that write to a protected path (heuristic; a pre-commit gate is the second fence).",
      "required_scripts": [
        "scripts/protected-paths-guard.py"
      ],
      "host_files": {
        "claude": ".claude/settings.json"
      }
    },
    {
      "id": "harness_fast_guard_precommit",
      "event": "pre-commit",
      "description": "Same fast guard at commit time, over the staged files only.",
      "required_scripts": [
        "scripts/agent-harness-fast-guard.py"
      ],
      "host_files": {
        "husky": ".husky/pre-commit"
      }
    },
    {
      "id": "question_gate",
      "event": "UserPromptSubmit|PreToolUse|Stop",
      "description": "Selectable-question gate for Intent/Spec/Plan: arms the stage on /__PREFIX__-intent, /__PREFIX__-spec, EnterPlanMode; validates every AskUserQuestion round (max_per_round, stage headers, recommended option first, min_options, exit 2 on violation); blocks a Stop whose last assistant text is a free-text question round. Config: question_gate.",
      "required_scripts": [
        "scripts/question-gate.py"
      ],
      "host_files": {
        "claude": ".claude/settings.json"
      }
    },
    {
      "id": "pr_body_gate",
      "event": "PreToolUse|PostToolUse|Stop",
      "description": "PR description gate: refuses a Write of docs/changes/*/pr.md that breaks artifact_chain.pr_body (length, title, Plan-Ref, sections, ≤3 boxes, ≤3 files, ≤10 evidence lines); remembers pr.md files touched in the session and blocks Stop while one breaks the shape or lacks a deliverable required by artifact_chain.deliverables.required_when.",
      "required_scripts": [
        "scripts/pr-body-gate.py"
      ],
      "host_files": {
        "claude": ".claude/settings.json"
      }
    },
    {
      "id": "agreement_runtime",
      "event": "UserPromptSubmit|PreToolUse|Stop",
      "required_scripts": [
        "scripts/agreement-gate.py"
      ],
      "host_files": {
        "claude": ".claude/settings.json",
        "codex": ".codex/hooks.json"
      },
      "description": "Fail-closed agreement, scope and completion gate with host-observed user approval."
    },
    {
      "id": "agreement_precommit",
      "event": "pre-commit",
      "required_scripts": [
        "scripts/agreement-gate.py"
      ],
      "host_files": {
        "husky": ".husky/pre-commit"
      },
      "description": "Check staged scope, current verification and PR against the approved revision."
    },
    {
      "id": "adr_stop",
      "event": "Stop",
      "description": "Validate ADR records when their directory changed; pause and agreement-draft handoffs remain incomplete.",
      "required_scripts": [
        "scripts/adr-gate.py"
      ],
      "host_files": {
        "claude": ".claude/settings.json",
        "codex": ".codex/hooks.json"
      }
    },
    {
      "id": "adr_precommit",
      "event": "pre-commit",
      "description": "Validate ADRs from the staged tree, including reciprocal supersession references.",
      "required_scripts": [
        "scripts/adr-gate.py"
      ],
      "host_files": {
        "husky": ".husky/pre-commit"
      }
    }
  ],
  "stale_project_names": [
    "__PROJECT_NAME__-old"
  ],
  "ci": {
    "required_package_scripts": [
      "check:harness",
      "check:harness:fast",
      "check:plan",
      "test:harness",
      "evals:harness"
    ],
    "pipeline_file": null,
    "recommended_pipeline_substrings": [
      "scripts/check-agent-harness.py --format text"
    ]
  },
  "agreement_gate": {
    "enabled": true,
    "skill": "__PREFIX__-agreement",
    "state": "worktree Git directory: harness-agreement.json",
    "verification_timeout_seconds": 300,
    "scope_template": "docs/changes/_templates/scope.json",
    "fallback_hosts": [
      "husky pre-commit"
    ],
    "rule": "Skills prepare drafts and exact scope. UserPromptSubmit approve <challenge> grants the matching draft. PreToolUse blocks unapproved/out-of-scope mutations; verify runs declared argv commands and binds results to source. Stop and pre-commit require current verification and the active PR even when pr.md was never touched. Hook errors fail closed. Trusted checkout/commands, not an OS sandbox.",
    "runtime_hosts": [
      "claude",
      "codex"
    ]
  },
  "adr_gate": {
    "root": "docs/decisions",
    "skill": "__PREFIX__-adr",
    "template": "docs/decisions/_template.md",
    "required_sections": [
      "배경",
      "결정",
      "검토한 대안",
      "결과와 감수한 비용",
      "재검토 조건",
      "근거"
    ],
    "statuses": [
      "proposed",
      "accepted",
      "superseded"
    ],
    "rule": "Opt-in ADR authoring through the skill. Validate changed ADRs at Stop and pre-commit: structure, IDs, status and reciprocal supersession links. No universal ADR requirement and no semantic approval claim."
  },
  "adr_suggestions": {
    "enabled": true,
    "max_candidates": 3,
    "state": "worktree Git directory: harness-adr-advice/",
    "rule": "Advisory only, before agreement prepare through PreToolUse. Match planned paths, let the ADR skill assess actual decision content and existing records, suggest briefly when useful. Never block, accept a decision, or require an ADR merely because a path matched. Suppress repeats for the same change and matched paths.",
    "rules": [
      {
        "id": "harness-policy",
        "topic": "하네스 승인·검증 정책",
        "globs": [
          ".agents/harness.yaml",
          ".claude/settings.json",
          ".codex/hooks.json",
          ".husky/**",
          "scripts/*gate*.py",
          "scripts/*guard*.py"
        ]
      },
      {
        "id": "auth-policy",
        "topic": "인증·권한 경계",
        "globs": [
          "auth/**",
          "**/auth/**",
          "permissions/**",
          "**/permissions/**",
          "security/**",
          "**/security/**"
        ]
      },
      {
        "id": "data-contract",
        "topic": "데이터·공유 계약",
        "globs": [
          "packages/**",
          "migrations/**",
          "**/migrations/**",
          "**/schema.prisma",
          "**/schema.sql",
          "**/*.proto",
          "openapi.*",
          "**/openapi.*"
        ]
      },
      {
        "id": "runtime-dependency",
        "topic": "주요 의존성·실행 환경",
        "globs": [
          "package.json",
          "**/package.json",
          "pyproject.toml",
          "**/pyproject.toml",
          "requirements.txt",
          "**/requirements.txt",
          "Cargo.toml",
          "go.mod"
        ]
      },
      {
        "id": "operations",
        "topic": "배포·운영 방식",
        "globs": [
          "infra/**",
          "terraform/**",
          ".github/workflows/**",
          "Dockerfile",
          "**/Dockerfile",
          "compose*.yml",
          "compose*.yaml"
        ]
      }
    ]
  }
}
